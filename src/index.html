<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare two texts and see what changed. Runs fully offline in your browser.">
  <meta name="author" content="Hossam Hamdy">
  <title>Text Diff</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Text <span>Diff</span></h1>
    <div class="opts">
      <label><input type="checkbox" id="ignoreWs"> Ignore whitespace</label>
      <label><input type="checkbox" id="ignoreCase"> Ignore case</label>
    </div>
    <div class="by">
      <button id="download" title="Save this page as one file that works without internet">⤓ Offline<span class="wide"> copy</span></button>
      <span>by Hossam Hamdy</span>
      <a href="https://github.com/hosamhamdy258/text-diff" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
        </svg>
      </a>
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="bar">
        <strong>Original</strong>
        <button data-open="aFile">Open</button>
        <button data-sort="a" title="Sort lines A→Z (Ctrl/Cmd+Z to undo)">Sort</button>
        <button data-clear="a">Clear</button>
        <input type="file" id="aFile">
      </div>
      <textarea id="a" spellcheck="false" aria-label="Original text" placeholder="Paste the original text here"></textarea>
    </section>

    <section class="pane">
      <div class="bar">
        <strong>Changed</strong>
        <button data-open="bFile">Open</button>
        <button data-sort="b" title="Sort lines A→Z (Ctrl/Cmd+Z to undo)">Sort</button>
        <button data-clear="b">Clear</button>
        <input type="file" id="bFile">
      </div>
      <textarea id="b" spellcheck="false" aria-label="Changed text" placeholder="Paste the changed text here"></textarea>
    </section>
  </main>

  <div class="controls">
    <button class="primary" id="compare" title="Ctrl/Cmd+Enter in either box">Compare</button>
    <div class="seg" role="radiogroup" aria-label="View">
      <label><input type="radio" name="view" value="unified"> Unified</label>
      <label><input type="radio" name="view" value="split"> Side by side</label>
    </div>
    <label class="check"><input type="checkbox" id="hideSame"> Hide unchanged</label>
    <span id="summary" role="status"></span>
  </div>

  <section class="result" id="result" aria-label="Differences"></section>

  <script src="diff.js"></script>
  <script src="app.js"></script>
</body>

</html>
